name: CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build release binaries
        run: cargo build --release --workspace --target x86_64-pc-windows-msvc

      - name: Package Windows distribution
        shell: pwsh
        run: |
          $pkgDir = "minecraft-crack-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $pkgDir

          # Copy compiled binaries
          Copy-Item "target/x86_64-pc-windows-msvc/release/voxel_viewer.exe" -Destination "$pkgDir/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/registry_baker.exe" -Destination "$pkgDir/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/property_extractor.exe" -Destination "$pkgDir/"

          # Copy assets required for runtime execution
          Copy-Item -Recurse "assets" -Destination "$pkgDir/assets"
          if (Test-Path "SPECS.md") { Copy-Item "SPECS.md" -Destination "$pkgDir/" }

          # Compress to zip
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "$pkgDir.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-crack-windows-x86_64
          path: minecraft-crack-windows-x86_64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: minecraft-crack-windows-x86_64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
